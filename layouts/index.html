{{ define "main" }}
{{ $p := site.Params }}
<div class="wrap home">
  <aside class="sidebar">
    {{ if fileExists "static/images/photo.jpg" }}
    <img class="photo" src="{{ "images/photo.jpg" | relURL }}" alt="Portrait of {{ $p.author }}" width="220" height="275">
    {{ end }}
    <h1>{{ $p.author }}</h1>
    <p class="title-line">{{ $p.title_line }}<br>{{ $p.department }}<br>{{ $p.university }}</p>
    <p class="interests"><span class="label">Research interests</span><br>{{ $p.research_interests }}</p>
  </aside>

  <div class="content">
    <section id="about" class="bio">
      {{ .Content }}
    </section>

    {{ partial "research.html" . }}
  </div>
</div>
{{ end }}
