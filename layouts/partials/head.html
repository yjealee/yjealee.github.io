<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light">
{{ $title := cond .IsHome site.Title (printf "%s | %s" .Title site.Title) }}
<title>{{ $title }}</title>
<meta name="description" content="{{ site.Params.description }}">
<meta name="author" content="{{ site.Params.author }}">
<link rel="canonical" href="{{ .Permalink }}">
<meta property="og:title" content="{{ $title }}">
<meta property="og:description" content="{{ site.Params.description }}">
<meta property="og:type" content="website">
<meta property="og:url" content="{{ .Permalink }}">
<link rel="icon" href="{{ "favicon.ico" | relURL }}" sizes="any">
<link rel="icon" type="image/png" sizes="32x32" href="{{ "favicon-32x32.png" | relURL }}">
<link rel="apple-touch-icon" href="{{ "apple-touch-icon.png" | relURL }}">
{{ $css := resources.Get "css/style.css" | minify | fingerprint }}
<link rel="stylesheet" href="{{ $css.RelPermalink }}">
{{ if .IsHome }}
<script type="application/ld+json">
{"@context":"https://schema.org","@type":"Person","name":"{{ site.Params.author }}","jobTitle":"{{ site.Params.title_line }}","affiliation":{"@type":"CollegeOrUniversity","name":"{{ site.Params.university }}"},"email":"mailto:{{ site.Params.email }}","url":"{{ site.BaseURL }}"}
</script>
{{ end }}
