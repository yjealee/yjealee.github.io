{{ define "main" }}
<div class="wrap page">
  <h1 class="page-title">{{ .Title }}</h1>
  {{ range site.Data.teaching }}
  <h3 class="position">{{ .position }}</h3>
  <ul class="rows">
    {{ range .courses }}
    <li>
      <span class="row-main">{{ .course }}{{ with .instructor }}<br><span class="meta small">TA for Prof. {{ . }}</span>{{ end }}</span>
      <span class="row-date">{{ .term }}</span>
    </li>
    {{ end }}
  </ul>
  {{ end }}
</div>
{{ end }}
